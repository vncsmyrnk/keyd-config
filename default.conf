# vim: set ft=toml:
[ids]
*

[main]

capslock = overload(special, noop)
apostrophe = overload(auxiliary, apostrophe)

# rightshift as the tmux prefix
rightshift = C-b

# Do nothing then super key is pressed. This avoids opening default desktop
# environment finders
leftmeta = overload(meta, noop)

[special]

# backtick dead key
leftbrace = macro(leftshift+leftbrace leftshift+leftbrace)

# tilde dead key
' = macro(' ')

# double quotes on [
] = ~

# single quotes on ]
\ = `

h = left
j = down
k = up
l = right
p = sysrq

i = insert
backspace = delete

enter = esc

[auxiliary]

a = home
d = end
w = pageup
s = pagedown
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12
capslock = capslock

# ç -> :
q = ?
meta = M-w
